allowBuilds:
  '@prisma/engines': true
  # An optional peer of better-auth's kysely adapter. We never use it — the
  # Prisma adapter is what's configured — but a frozen-lockfile install still
  # sees its build script and fails with ERR_PNPM_IGNORED_BUILDS unless this
  # says what to do with it. It is absent from node_modules locally, which is
  # why this entry looks dead and is not.
  better-sqlite3: false
  core-js: false
  esbuild: true
  msgpackr-extract: set this to true or false
  prisma: true
  sharp: false
  unrs-resolver: false
  workerd: set this to true or false

minimumReleaseAgeExclude:
  - posthog-js@1.430.3

overrides:
  '@hono/node-server': '^1.19.15'
  deepmerge-ts: '>=8.0.0'
  hono: '^4.13.5'
  lodash: '^4.18.1'
  mysql2: '>=3.24.3'
  valibot: '^1.4.2'
